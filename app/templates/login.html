{% extends "base.html" %}
{% block title %}Login — Recepção{% endblock %}
{% block header %}<h1>Recepção — Login</h1>{% endblock %}
{% block content %}
    {% if error %}
        <p style="color:#b91c1c">{{ error }}</p>
    {% endif %}
    <form method="post" action="/reception/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Usuário: <input type="text" name="username" required></label><br><br>
        <label>Senha: <input type="password" name="password" required></label><br><br>
        <button type="submit">Entrar</button>
    </form>
{% endblock %}
